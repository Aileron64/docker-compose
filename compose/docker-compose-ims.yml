services:

  ims:
    restart: unless-stopped
    image: ${IMS_SERVICE_REPO}
    container_name: ${IMS_SERVICE_CONTAINER_NAME}
    # build:
    #   context: ../
    #   dockerfile: ./configs/ims/Dockerfile
    depends_on:
      - bioformat
    environment:
      - IMS_STORAGE_PATH=${IMS_STORAGE_PATH}
      - IMS_SERVICE_ROOT_CONTEXT=${IMS_SERVICE_ROOT_CONTEXT}
      - CORE_SERVICE_HOSTNAME=http://${CORE_SERVICE_CONTAINER_NAME}:8080/${CORE_SERVICE_ROOT_CONTEXT}
      - IMS_SERVICE_EXTERNAL_HOSTNAME=${SV_HTTP_PROTOCOL}://${SV_HOSTNAME}/${IMS_SERVICE_ROOT_CONTEXT}
      - IMS_SERVICE_INTERNAL_HOSTNAME=http://${IMS_SERVICE_CONTAINER_NAME:8080}/${IMS_SERVICE_ROOT_CONTEXT}
      - IIP_SERVER_HOSTNAME=http://${IIP_CYTO_CONTAINER_NAME}:80
    volumes:
      - ${IMS_STORAGE_PATH}:${IMS_STORAGE_PATH}:rw
      - ${IMS_BUFFER_PATH}:/tmp/uploaded:rw
      # - ../configs/ims/application.yml:/app/main/application.yml
    networks:
      - slidevault

