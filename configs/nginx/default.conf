user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;
events {
  worker_connections  1024;
}


http {
    client_max_body_size 10000M;
    include       mime.types;
    default_type  application/octet-stream;
    server_names_hash_bucket_size  128;

    log_format  main  '$host - $remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  120;
    proxy_connect_timeout 75;

    large_client_header_buffers 4 16k;

    server {
        listen       443 ssl;
        server_name  $SV_HOSTNAME;

        ssl_certificate /etc/cert/certificate.crt;
        ssl_certificate_key /etc/cert/key.key;
        include ssl.conf;

        location /auth {
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Server $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://keycloak-service:8080;
        }
        location / {
            resolver 127.0.0.11 valid=180s; #This is a trick to wait for gateway to up since gateway is dependent on nginx hostname
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Server $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://gateway-service:8080;
        }
    }

    server {
        listen  80 default_server;
        listen  [::]:80 default_server;
        server_name  $SV_HOSTNAME;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen  81;
        listen  [::]:81;
        server_name  localhost;

        location / {
            root   /app;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}

