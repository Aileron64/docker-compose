spring:
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 3GB
      max-request-size: 3GB
  flyway:
    # create-schemas: true
    schemas: ${POSTGRES_SCHEMA}
    baselineOnMigrate: true
  main:
    #    lazy-initialization: true
    allow-circular-references: true
  thymeleaf:
    prefix: 'classpath:/templates/'
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://${POSTGRES_HOST}/${POSTGRES_DB}?currentSchema=${POSTGRES_SCHEMA}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    hikari:
      poolName: Hikari
      auto-commit: false
  jpa:
    database-platform: be.cytomine.config.CustomPostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        ddl-auto: validate
        format_sql: false
        jdbc:
          batch_size: 50

  data:
    mongodb:
      authentication-database: ${MONGO_DATABASE}
      username: ${MONGO_USERNAME}
      password: ${MONGO_PASSWORD}
      database: ${MONGO_DATABASE}
      port: 27017
      host: ${MONGO_HOST}

  mail:
    host: smtp.mailgun.org
    port: 587
    username: CONFIGURE_YOUR_MAILGUN_CREDENTIALS # example: postmaster@sandboxdcb41...5909.mailgun.org
    password: CONFIGURE_YOUR_MAILGUN_CREDENTIALS # example: 0da253cf5...24-4662f38e

server:
  port: 8080
  servlet:
    context-path: ${CORE_SERVICE_ROOT_CONTEXT}
    session:
      cookie:
        secure: false
        httpOnly: false
        maxAge: ${application.authentication.jwt.token-validity-in-seconds}

javamelody:
  enabled: false
  #  url-exclude-pattern: /notify*
  init-parameters:
    authorized-users: admin
    storage-directory: C:\\cygwin64\\home\\amishra\\tech\\project\\core-spring\\storage

